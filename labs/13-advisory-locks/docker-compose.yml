name: lab13-advisory-locks

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab13-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab13}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab13}
      POSTGRES_DB: ${POSTGRES_DB:-lab13}
    # log_statement=all makes every SQL statement visible in `docker compose logs postgres`,
    # which is how this lab shows the exact pg_advisory_lock/pg_try_advisory_lock/
    # pg_advisory_unlock/pg_advisory_xact_lock calls each scenario sends.
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5413}:5432"
    volumes:
      - lab13_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab13} -d ${POSTGRES_DB:-lab13}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab13-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab13}:${POSTGRES_PASSWORD:-lab13}@postgres:5432/${POSTGRES_DB:-lab13}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8413}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lab13_postgres_data:
