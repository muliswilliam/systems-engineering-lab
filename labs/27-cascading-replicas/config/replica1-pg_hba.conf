# A real, non-hypothetical bitnami/postgresql limitation this lab surfaces:
# bitnami's entrypoint ONLY appends a "host replication ..." pg_hba.conf
# entry when POSTGRESQL_REPLICATION_MODE=master (see
# postgresql_add_replication_to_pghba in /opt/bitnami/scripts/libpostgresql.sh,
# called only from the `[[ "$POSTGRESQL_REPLICATION_MODE" = "master" ]]`
# branches). A node running in "slave" mode never gets that entry added for
# itself, because bitnami's image was not written with cascading replication
# in mind - it assumes a slave is always a leaf. Without this file,
# replica-2's initial pg_basebackup against replica-1 fails outright with a
# real captured error:
#
#   pg_basebackup: error: connection to server at "replica-1" ... failed:
#   FATAL:  no pg_hba.conf entry for replication connection from host
#   "<replica-2 ip>", user "repl_user", no encryption
#
# The fix: replace replica-1's pg_hba.conf with this file (identical to what
# bitnami generates for a MASTER node, i.e. it also permits incoming
# replication connections), via the POSTGRESQL_MOUNTED_CONF_DIR override
# mechanism bitnami's entrypoint supports (mount this file at
# /bitnami/postgresql/conf/pg_hba.conf and set
# POSTGRESQL_USE_CUSTOM_PGHBA_INITIALIZATION=yes - see docker-compose.yml's
# replica-1 service). This is a real, documented bitnami/postgresql
# extension point, not a hack around the image.
host     all             all             0.0.0.0/0               md5
host     all             all             ::/0                    md5
local    all             all                                     md5
host     all             all        127.0.0.1/32                 md5
host     all             all        ::1/128                      md5
host      replication     all             0.0.0.0/0               md5
host      replication     all             ::/0                    md5
