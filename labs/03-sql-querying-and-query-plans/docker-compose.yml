name: lab03-sql-querying-and-query-plans

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab03-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab03}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab03}
      POSTGRES_DB: ${POSTGRES_DB:-lab03}
    # log_statement=all makes every SQL statement visible in `docker compose logs postgres`,
    # which is useful for comparing what Drizzle sends against the raw SQL this lab writes by hand.
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5403}:5432"
    volumes:
      - lab03_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab03} -d ${POSTGRES_DB:-lab03}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab03-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab03}:${POSTGRES_PASSWORD:-lab03}@postgres:5432/${POSTGRES_DB:-lab03}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8403}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lab03_postgres_data:
