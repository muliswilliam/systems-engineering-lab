name: lab01-postgres-drizzle-foundation

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab01-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab01}
      POSTGRES_DB: ${POSTGRES_DB:-lab01}
    # log_statement=all makes every SQL statement visible in `docker compose logs postgres`,
    # which is how this lab shows the SQL Drizzle actually generates.
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5401}:5432"
    volumes:
      - lab01_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab01} -d ${POSTGRES_DB:-lab01}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab01-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab01}:${POSTGRES_PASSWORD:-lab01}@postgres:5432/${POSTGRES_DB:-lab01}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8401}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lab01_postgres_data:
