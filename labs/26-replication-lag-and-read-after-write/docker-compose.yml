name: lab26-replication-lag-and-read-after-write

# Same two-node bitnami/postgresql shape as Lab 24 (which this lab builds on
# conceptually, but does NOT share a Docker network, volume, or database
# with) - see Lab 24's README.md "Architecture" for the full rationale on
# why bitnami/postgresql is used here instead of this repository's usual
# postgres:16-alpine. Short version: POSTGRESQL_REPLICATION_MODE-driven
# setup avoids hand-authoring pg_hba.conf/pg_basebackup just to get two
# nodes streaming, and this lab needs a genuine, already-working replication
# topology as its starting point rather than teaching replication setup
# itself again.
services:
  primary:
    image: bitnami/postgresql:latest
    container_name: lab26-primary
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_password}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-lab26}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-lab26}
      POSTGRESQL_ENABLE_TLS: "no"
    ports:
      - "${PRIMARY_POSTGRES_PORT:-5426}:5432"
    volumes:
      - lab26_primary_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "${POSTGRES_DB:-lab26}"]
      interval: 5s
      timeout: 5s
      retries: 20

  replica:
    image: bitnami/postgresql:latest
    container_name: lab26-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_password}
      POSTGRESQL_MASTER_HOST: primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-lab26}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-lab26}
      POSTGRESQL_ENABLE_TLS: "no"
    ports:
      - "${REPLICA_POSTGRES_PORT:-5526}:5432"
    volumes:
      - lab26_replica_data:/bitnami/postgresql
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "${POSTGRES_DB:-lab26}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgweb-primary:
    image: sosedoff/pgweb
    container_name: lab26-pgweb-primary
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-lab26}@primary:5432/${POSTGRES_DB:-lab26}?sslmode=disable
    ports:
      - "${PRIMARY_PGWEB_PORT:-8426}:8081"
    depends_on:
      primary:
        condition: service_healthy

  pgweb-replica:
    image: sosedoff/pgweb
    container_name: lab26-pgweb-replica
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-lab26}@replica:5432/${POSTGRES_DB:-lab26}?sslmode=disable
    ports:
      - "${REPLICA_PGWEB_PORT:-8526}:8081"
    depends_on:
      replica:
        condition: service_healthy

volumes:
  lab26_primary_data:
  lab26_replica_data:
