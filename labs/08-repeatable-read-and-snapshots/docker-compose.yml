name: lab08-repeatable-read-and-snapshots

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab08-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab08}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab08}
      POSTGRES_DB: ${POSTGRES_DB:-lab08}
    # log_statement=all makes every SQL statement visible in `docker compose logs postgres`,
    # which is how this lab shows the BEGIN/SET TRANSACTION ISOLATION LEVEL/COMMIT
    # sequence each scenario actually sends.
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5408}:5432"
    volumes:
      - lab08_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab08} -d ${POSTGRES_DB:-lab08}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab08-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab08}:${POSTGRES_PASSWORD:-lab08}@postgres:5432/${POSTGRES_DB:-lab08}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8408}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lab08_postgres_data:
