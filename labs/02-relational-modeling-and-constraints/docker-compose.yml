name: lab02-relational-modeling-and-constraints

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab02-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab02}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab02}
      POSTGRES_DB: ${POSTGRES_DB:-lab02}
    # log_statement=all makes every SQL statement visible in `docker compose logs postgres`,
    # which is how this lab shows the exact DDL/DML behind each constraint experiment.
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5402}:5432"
    volumes:
      - lab02_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab02} -d ${POSTGRES_DB:-lab02}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab02-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab02}:${POSTGRES_PASSWORD:-lab02}@postgres:5432/${POSTGRES_DB:-lab02}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8402}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lab02_postgres_data:
