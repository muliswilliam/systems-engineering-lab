name: lab38-observability

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab38-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab38}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab38}
      POSTGRES_DB: ${POSTGRES_DB:-lab38}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - lab38_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab38} -d ${POSTGRES_DB:-lab38}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: lab38-pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-lab38}:${POSTGRES_PASSWORD:-lab38}@postgres:5432/${POSTGRES_DB:-lab38}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8438}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Real Prometheus, scraping this lab's own Node process on the HOST (this
  # repo never containerizes a lab's own app process - see every other lab's
  # `pnpm dev`). `host.docker.internal` resolves back to the host on Docker
  # Desktop (macOS/Windows); `extra_hosts` below makes the same hostname work
  # on native Linux Docker too. Prometheus's own healthcheck only depends on
  # ITS process being up, not on successfully scraping the app - exactly like
  # a real deployment, where Prometheus starts fine even if a scrape target is
  # temporarily down, and just reports that target as `up=0` on its /targets
  # page. Start the app (`pnpm dev`) before or after `docker compose up -d`;
  # order does not matter for either side.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lab38-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9438}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lab38_postgres_data:
